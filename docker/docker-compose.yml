services:
  # MongoDB
  mongo:
    image: mongo:8.0
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    env_file:
      - ./env/.env.mongo
    networks:
      - backend
    restart: always

  # Qdrant (VectorDB)
  qdrant:
    image: qdrant/qdrant:v1.19
    container_name: qdrant
    ports:
      - "6333:6333"
      # for the grpc service
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    env_file:
      - ./env/.env.qdrant
    networks:
      - backend
    restart: always

  # Cloudflare Tunnel for exposing the app to a public trial URL
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    network_mode: host
    env_file:
      - ./env/.env.cloudflare
    command: tunnel --no-autoupdate run
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  mongo_data:
  qdrant_data:

  