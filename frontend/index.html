<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbit · Your AI Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>
<div class="app">
  <header class="top-nav">
    <div class="brand">
      <div class="logo-orb"></div>
      <div>
        <h1>Orbit</h1>
        <span class="status"><span class="status-dot" id="status-dot"></span><span id="status-text">Ready</span></span>
      </div>
    </div>
    <div class="header-actions">
      <button id="settings-btn" class="icon-btn" title="Settings">⚙️</button>
      <button id="new-chat-btn" class="btn">New chat</button>
    </div>
  </header>

  <div id="settings-panel" class="settings hidden">
    <label>Voice
      <select id="voice-select">
        <option value="af_heart">af_heart (F)</option><option value="af_bella">af_bella (F)</option>
        <option value="am_adam">am_adam (M)</option><option value="am_michael">am_michael (M)</option>
        <option value="bf_emma">bf_emma (UK F)</option><option value="bm_george">bm_george (UK M)</option>
      </select></label>
    <label>Asset ID <input id="asset-id-input" value="22"></label>
    <label>Thread ID <input id="thread-id-input" value="session_01"></label>
  </div>

  <main class="chat" id="chat">
    <div id="empty" class="empty">
      <div class="logo-orb big"></div>
      <h2>How can I help you today?</h2>
      <p>Ask about your documents, get a report, or have it emailed to you.</p>
      <div class="chips">
        <button class="chip">Summarize the main points</button>
        <button class="chip">Write a report on the main points</button>
        <button class="chip">Email me a summary</button>
      </div>
    </div>
    <div id="messages" class="messages"></div>
  </main>

  <footer class="composer-wrap">
    <div class="composer">
      <textarea id="user-input" rows="1" placeholder="Message Orbit…"></textarea>
      <button id="dictate-btn" class="icon-btn" title="Dictate (fills the text box)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5a3 3 0 0 0-6 0v6c0 1.66 1.34 3 3 3zm5-3a5 5 0 0 1-10 0H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92z"/></svg>
      </button>
      <button id="send-btn" class="send-btn" title="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
      <button id="voice-btn" class="voice-btn" title="Voice mode">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="3" y="9" width="2.5" height="6" rx="1"/><rect x="8" y="5" width="2.5" height="14" rx="1"/><rect x="13" y="8" width="2.5" height="8" rx="1"/><rect x="18" y="4" width="2.5" height="16" rx="1"/></svg>
      </button>
    </div>
    <div class="hint" id="hint">Enter to send · Shift+Enter for a new line</div>
  </footer>
</div>

<div id="voice-overlay" class="voice-overlay hidden">
  <div class="voice-stage">
    <div id="orb" class="orb listening"></div>
    <div id="voice-status" class="voice-status">Listening…</div>
    <div id="voice-transcript" class="voice-transcript"></div>
  </div>
  <div class="voice-controls">
    <button id="voice-mute" class="round-btn" title="Mute mic">🎙️</button>
    <button id="voice-close" class="round-btn close" title="End voice mode">✕</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
